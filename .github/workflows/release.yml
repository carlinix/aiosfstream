name: Release

# Publish the exact distributions attached to a GitHub Release. The workflow
# accepts the project's existing unprefixed SemVer tags, such as `1.2.0`.
#
# One-time prerequisites:
#   1. Publish aiocometd 1.0.0 to PyPI. The aiosfstream wheel declares
#      `aiocometd>=1.0.0`, while uv resolves development installs from GitHub.
#   2. Register a PyPI Trusted Publisher with these values:
#        Owner: carlinix
#        Repository: aiosfstream
#        Workflow: release.yml
#        Environment: pypi
#   3. Set the repository variable ENABLE_PYPI_PUBLISH to `true`.
on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release; it must match the package version"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"
  UV_FROZEN: "1"

jobs:
  guard:
    name: Verify release version
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Verify tag and package version
        id: check
        shell: bash
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RAW_TAG"
          tag="${tag#refs/tags/}"
          tag_ref="refs/tags/$tag"
          version=$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")

          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$tag' is not an unprefixed SemVer version."
            exit 1
          fi
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Release tag '$tag' does not match package version '$version'."
            exit 1
          fi
          if ! git show-ref --verify --quiet "$tag_ref"; then
            echo "::error::Release tag '$tag' does not exist."
            exit 1
          fi

          commit=$(git rev-parse "$tag_ref^{commit}")
          if [[ "$(git rev-parse HEAD)" != "$commit" ]]; then
            echo "::error::Checked-out commit does not match release tag '$tag'."
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build distributions
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.commit }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.2"
      - name: Install Python
        run: uv python install 3.13
      - name: Install build dependencies
        run: >-
          uv sync --no-default-groups --group build --group docs --python 3.13
      - name: Build distributions
        run: uv build --no-sources
      - name: Validate metadata
        run: uv run --no-sync twine check --strict dist/*
      - name: Validate wheel contents
        run: uv run --no-sync check-wheel-contents dist/*.whl
      - name: Build documentation from source distribution
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p extracted-sdist
          tar -xzf "$GITHUB_WORKSPACE"/dist/*.tar.gz -C extracted-sdist
          uv run --project "$GITHUB_WORKSPACE" --no-sync sphinx-build -E -W --keep-going -b html extracted-sdist/*/docs/source sdist-docs
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: ${{ vars.ENABLE_PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/aiosfstream/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub Release
    needs: [guard, build, publish-pypi]
    if: >-
      ${{ always()
      && needs.guard.result == 'success'
      && needs.build.result == 'success'
      && (needs.publish-pypi.result == 'success'
          || needs.publish-pypi.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.commit }}
          fetch-depth: 0
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: >-
          gh release create "$VERSION" dist/*
          --title "$VERSION"
          --generate-notes
          --verify-tag
