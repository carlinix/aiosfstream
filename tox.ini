[tox]
envlist = py312

[testenv]
extras = tests
commands =
    coverage run -m pytest tests
    coverage report

# Linting and type checking are opt-in: `tox -e lint`.
# They currently report pre-existing failures on develop
# (8 mypy --strict errors, 1 flake8 E501), so they are kept
# out of envlist to stop `tox` from failing on unrelated debt.
[testenv:lint]
extras = tests
commands =
    flake8 aiosfstream
    pylint aiosfstream
    mypy --strict aiosfstream
